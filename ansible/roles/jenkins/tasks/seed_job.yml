---
- name: Wait for Jenkins API to be responsive
  uri:
    url: "http://127.0.0.1:8080/api/json"
    user: admin
    password: "{{ lookup('env', 'JENKINS_ADMIN_PASSWORD') }}"
    force_basic_auth: true
    status_code: 200
  register: jenkins_api
  retries: 20
  delay: 15
  until: jenkins_api.status == 200
  no_log: true

- name: Set Jenkins URL via script console (required for CLI handshake)
  uri:
    url: "http://127.0.0.1:8080/scriptText"
    method: POST
    user: admin
    password: "{{ lookup('env', 'JENKINS_ADMIN_PASSWORD') }}"
    force_basic_auth: true
    body: "script=import+jenkins.model.*%3BJenkinsLocationConfiguration.get().setUrl('http%3A%2F%2F{{ ansible_host }}%3A8080%2F')%3BJenkinsLocationConfiguration.get().save()"
    status_code: 200
  no_log: true

- name: Copy Deploy-EC2 job XML to Jenkins home
  copy:
    src: seed-job.xml
    dest: /var/jenkins_home/deploy-ec2-job.xml
    mode: '0644'

- name: Download Jenkins CLI jar from running container
  shell: |
    curl -fsSL -o /usr/local/bin/jenkins-cli.jar \
      http://127.0.0.1:8080/jnlpJars/jenkins-cli.jar
  args:
    creates: /usr/local/bin/jenkins-cli.jar

- name: Install Java 21 on host for Jenkins CLI
  apt:
    name: openjdk-21-jre-headless
    state: present

- name: Create Deploy-EC2 pipeline job via Jenkins CLI
  shell: |
    java -jar /usr/local/bin/jenkins-cli.jar \
      -s http://127.0.0.1:8080 \
      -auth "admin:${JENKINS_ADMIN_PASSWORD}" \
      create-job "Deploy-EC2" < /var/jenkins_home/deploy-ec2-job.xml
  args:
    creates: /var/jenkins_home/jobs/Deploy-EC2/config.xml
  environment:
    JENKINS_ADMIN_PASSWORD: "{{ lookup('env', 'JENKINS_ADMIN_PASSWORD') }}"
  no_log: true
