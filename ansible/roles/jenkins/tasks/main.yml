---
- name: Create Jenkins home directory on host
  file:
    path: /var/jenkins_home
    state: directory
    owner: 1000
    group: 1000
    mode: '0755'

- name: Create Jenkins init.groovy.d directory
  file:
    path: /var/jenkins_home/init.groovy.d
    state: directory
    owner: 1000
    group: 1000
    mode: '0755'

- name: Deploy admin user init script
  template:
    src: basic-security.groovy.j2
    dest: /var/jenkins_home/init.groovy.d/basic-security.groovy
    owner: 1000
    group: 1000
    mode: '0600'
  no_log: true

- name: Pull Jenkins LTS Docker image
  community.docker.docker_image:
    name: jenkins/jenkins
    tag: lts
    source: pull

- name: Run Jenkins container
  community.docker.docker_container:
    name: jenkins
    image: jenkins/jenkins:lts
    state: started
    restart_policy: always
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - /var/jenkins_home:/var/jenkins_home
    env:
      JAVA_OPTS: "-Djava.awt.headless=true -Djenkins.install.runSetupWizard=false"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/login"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

- name: Wait for Jenkins to be up on port 8080
  wait_for:
    port: 8080
    host: 127.0.0.1
    timeout: 300

- name: Install Pipeline and Git plugins via jenkins-plugin-cli
  command: >
    docker exec -u root jenkins
    jenkins-plugin-cli --plugins "workflow-aggregator:latest git:latest"
    --plugin-download-directory /var/jenkins_home/plugins
  register: plugin_install
  changed_when: "'Done' in plugin_install.stdout"

- name: Restart Jenkins container to load plugins
  community.docker.docker_container:
    name: jenkins
    state: started
    restart: true

- name: Wait for Jenkins to come back up after plugin install
  uri:
    url: "http://127.0.0.1:8080/api/json"
    user: admin
    password: "{{ lookup('env', 'JENKINS_ADMIN_PASSWORD') }}"
    force_basic_auth: true
    status_code: 200
  register: jenkins_ready
  retries: 20
  delay: 15
  until: jenkins_ready.status == 200

- name: Seed the Deploy-EC2 pipeline job
  import_tasks: seed_job.yml
