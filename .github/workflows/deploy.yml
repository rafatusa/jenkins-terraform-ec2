name: deploy
'on':
  workflow_dispatch: {}
jobs:
  provision:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
    timeout-minutes: 30
    outputs:
      jenkins_ip: ${{ steps.get_ip.outputs.jenkins_ip }}
    steps:
    - uses: actions/checkout@v4
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
    - name: Terraform Init
      run: "terraform init -input=false -reconfigure \\\n  -backend-config=\"bucket=${{\
        \ secrets.TF_STATE_BUCKET }}\" \\\n  -backend-config=\"key=${{ secrets.PROJECT_NAME\
        \ }}/terraform.tfstate\" \\\n  -backend-config=\"region=us-east-1\"\n"
      working-directory: infra
    - id: tf_apply
      name: Terraform Apply
      run: terraform apply -input=false -auto-approve
      working-directory: infra
    - id: get_ip
      name: Get Jenkins IP
      run: 'echo "jenkins_ip=$(terraform output -raw jenkins_public_ip)" >> "$GITHUB_OUTPUT"

        '
      working-directory: infra
  configure:
    runs-on: ubuntu-latest
    needs:
    - provision
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - name: Install Ansible
      run: pip install ansible-core
    - name: Write SSH Key
      run: 'mkdir -p ~/.ssh

        printf ''%s\n'' "$SSH_KEY" > ~/.ssh/deploy_key

        chmod 600 ~/.ssh/deploy_key

        '
      env:
        SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
    - name: Scan Host Key
      run: 'ssh-keyscan -H "${{ needs.provision.outputs.jenkins_ip }}" >> ~/.ssh/known_hosts

        '
    - name: Generate Inventory
      run: 'cat > ansible/inventory.ini <<EOF

        [jenkins]

        ${{ needs.provision.outputs.jenkins_ip }} ansible_user=${{ secrets.SSH_USER
        }} ansible_ssh_private_key_file=~/.ssh/deploy_key

        EOF

        '
    - name: Run Ansible Playbook
      run: ansible-playbook -i ansible/inventory.ini ansible/site.yml
      env:
        JENKINS_ADMIN_PASSWORD: ${{ secrets.JENKINS_ADMIN_PASSWORD }}
  verify:
    runs-on: ubuntu-latest
    needs:
    - provision
    - configure
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - name: Health Check Jenkins
      run: "curl --fail --retry 15 --retry-delay 20 --retry-all-errors \\\n  http://${{\
        \ needs.provision.outputs.jenkins_ip }}/login\n"
